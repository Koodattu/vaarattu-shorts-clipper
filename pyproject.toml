[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "vaarattu-shorts-clipper"
version = "0.1.0"
description = "Local, single-VOD Finnish conversation-to-shorts pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "numpy>=2.1,<3", "huggingface-hub>=0.28,<2",
  "yt-dlp>=2026.1.1", "tzdata>=2025.1",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
vaarattu-shorts = "vaarattu_shorts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vaarattu_shorts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
